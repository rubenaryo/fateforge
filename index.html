<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FateForge — Character Creator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>FateForge</h1>
    <p class="tagline">A character creation utility.</p>
  </header>

  <section class="controls">
    <label>
      <span>Schema</span>
      <select id="schema-select"></select>
    </label>
    <label>
      <span>Dataset</span>
      <select id="dataset-select"></select>
    </label>
    <button id="roll-btn" type="button">Roll</button>
  </section>

  <p id="warning" class="warning" hidden></p>

  <section id="sheet" class="sheet"></section>

  <script type="module" src="src/main.js"></script>
</body>
</html>
